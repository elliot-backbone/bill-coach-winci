# An interactive Coach session on a real Windows machine.
#
# The automated smoke test proves the machinery. This proves the thing no test can: what it is
# like to sit in front of Coach on Windows and use it. You get a shell on the runner, type
# `coach`, sign in once, and talk to it.
#
# THE REAL PACKAGE NEVER ENTERS THIS REPO. This repo is public and holds only the scrubbed
# build. The real one — Bill's record, the licensed deal baseline, field notes derived from
# copyrighted works — is fetched at run time from a PRIVATE repo over SSH, using a read-only
# deploy key held as a secret here. The runner is destroyed when the job ends and takes its
# copy with it. Nothing is committed, nothing is uploaded, nothing survives.
#
# ACCESS IS LOCKED TO YOU. `limit-access-to-actor: true` means only the GitHub account that
# started the run can connect, even though the connection details appear in a public log.

name: windows-interactive

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to install'
        required: true
        default: 'real'
        type: choice
        options: [real, scrubbed]
      minutes:
        description: 'How long to hold the session open'
        required: true
        default: '60'
      expected_version:
        description: 'Exact real package version expected from the private repo'
        required: true
        default: '1.13.1'

jobs:
  session:
    runs-on: windows-latest
    timeout-minutes: 125

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Claude Code
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.238
          claude --version

      - name: Fetch the real package from the private repo
        if: ${{ github.event.inputs.package == 'real' }}
        shell: pwsh
        env:
          DEPLOY_KEY: ${{ secrets.PACKAGE_DEPLOY_KEY }}
          EXPECTED_VERSION: ${{ github.event.inputs.expected_version }}
        run: |
          # The key lands in the runner's temp directory and is locked to this user, because
          # OpenSSH refuses a private key that anyone else on the box can read.
          # It MUST end in a newline: without one OpenSSH rejects it as
          # "error in libcrypto: unsupported", which reads like a key format problem and is not.
          # The ACL grants FULL control rather than read, or the cleanup below cannot delete it.
          $keyPath = Join-Path $env:RUNNER_TEMP 'package_key'
          $key = ($env:DEPLOY_KEY -replace "`r`n", "`n").TrimEnd() + "`n"
          [System.IO.File]::WriteAllText($keyPath, $key, (New-Object System.Text.UTF8Encoding $false))
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(F)" | Out-Null
          $env:GIT_SSH_COMMAND = "ssh -i `"$keyPath`" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          $probe = (& ssh -i "$keyPath" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -T git@github.com 2>&1 | Out-String)
          Write-Host "key check: $($probe.Trim())"
          git clone --depth 1 git@github.com:elliot-backbone/bill-coach-package.git "$env:RUNNER_TEMP\pkg"
          Remove-Item $keyPath -Force
          $zips = @(Get-ChildItem "$env:RUNNER_TEMP\pkg\Bill-Jennings-Coach--*.zip" -File)
          if ($zips.Count -ne 1) {
            throw "expected exactly one Bill-Jennings-Coach package zip, found $($zips.Count)"
          }
          $zip = $zips[0]

          # The checksum is a sibling of the unique release zip and must use the
          # portable shasum form: lowercase hash, two spaces, basename, newline.
          # Rejecting paths here prevents an old checksum from silently naming a
          # different archive elsewhere on the build machine.
          $checksumPath = "$($zip.FullName).sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "the release zip has no sibling .sha256 file"
          }
          $checksumText = [System.IO.File]::ReadAllText($checksumPath)
          $checksumMatch = [regex]::Match($checksumText, '\A([0-9a-f]{64})  ([^/\\:\r\n]+)\r?\n\z')
          if (-not $checksumMatch.Success) {
            throw "the release checksum is not lowercase basename-only shasum format"
          }
          if ($checksumMatch.Groups[2].Value -cne $zip.Name) {
            throw "the release checksum names a different archive"
          }
          $actualHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $checksumMatch.Groups[1].Value) {
            throw "the release archive does not match its checksum"
          }

          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "expected_version must be x.y.z"
          }
          $expectedZipName = "Bill-Jennings-Coach--$($env:EXPECTED_VERSION).zip"
          if ($zip.Name -cne $expectedZipName) {
            throw "the unique release archive is not the requested version"
          }

          Write-Host "fetched $($zip.Name), $([math]::Round($zip.Length/1MB,1)) MB"
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\coach" -Force
          $packagePath = "$env:RUNNER_TEMP\coach\package"
          node build\manifest-integrity-test.mjs $packagePath
          if ($LASTEXITCODE -ne 0) { throw "the real package manifest is stale or incomplete" }

          $manifest = Get-Content -LiteralPath "$packagePath\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -cne $env:EXPECTED_VERSION) {
            throw "the manifest version is not the requested version"
          }
          if ($zip.Name -cne "Bill-Jennings-Coach--$($manifest.version).zip") {
            throw "the manifest version and archive basename disagree"
          }
          Write-Host "PASS private archive, checksum, version and manifest"
          "PKG=$packagePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Use the scrubbed package instead
        if: ${{ github.event.inputs.package == 'scrubbed' }}
        shell: pwsh
        run: |
          Expand-Archive -Path test-package.zip -DestinationPath "$env:RUNNER_TEMP\coach" -Force
          "PKG=$env:RUNNER_TEMP\coach\package" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Coach
        shell: pwsh
        run: |
          Push-Location $env:PKG
          $out = (& node install\install.mjs 2>$null | Out-String).Trim()
          Pop-Location
          Write-Host "installer said: $out"
          if ($out -notmatch '^(installed|upgraded|repaired)') { throw "install failed: $out" }
          # The PATH change is written to the user environment and does not reach this process.
          $userPath = [Environment]::GetEnvironmentVariable('Path','User')
          "PATH=$userPath;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prove the exact private prepopulation reached the install
        if: ${{ github.event.inputs.package == 'real' }}
        shell: pwsh
        run: |
          $data = "$env:USERPROFILE\.claude-bill-career-coach\plugins\data\bill-career-coach-skills-dir"
          node build\installed-prepopulation-test.mjs $env:PKG $data
          if ($LASTEXITCODE -ne 0) { throw "installed private prepopulation did not verify" }

      - name: Verify the install and Claude MCP attachment
        shell: pwsh
        run: |
          $verifyOut = (& node "$env:PKG\install\verify-install.mjs" 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $verifyOut -notmatch '^ok') {
            throw "verify-install did not report ok"
          }
          Write-Host "PASS verify-install"

          $profileDir = "$env:USERPROFILE\.claude-bill-career-coach"
          $env:CLAUDE_CONFIG_DIR = $profileDir
          $mcpOut = (& claude mcp list 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Claude Code could not inspect the coach MCP registration" }
          if ($mcpOut -notmatch 'bill-coach') { throw "Claude Code does not see the coach server" }
          if ($mcpOut -notmatch 'bill-coach.*(Connected|\u2714)') {
            throw "Claude Code sees the coach server but it is not connected"
          }
          Write-Host "PASS Claude Code sees bill-coach connected"

      - name: How to use this session
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================ COACH IS INSTALLED ================"
          Write-Host ""
          Write-Host "  Connect using the SSH command printed below, then:"
          Write-Host ""
          Write-Host "    coach"
          Write-Host ""
          Write-Host "  First launch asks for a one-time Claude sign-in. It prints a URL:"
          Write-Host "  open it in your own browser, approve, paste the code back."
          Write-Host ""
          Write-Host "  Package installed: ${{ github.event.inputs.package }}"
          Write-Host "  Profile:  `$env:USERPROFILE\.claude-bill-career-coach"
          Write-Host "  Session ends when you type 'exit', or after ${{ github.event.inputs.minutes }} minutes."
          Write-Host ""
          Write-Host "  The package, profile and state are destroyed with the runner."
          Write-Host "  Only the actor-restricted tmate SSH line is retained for one day."
          Write-Host ""
          Write-Host "===================================================="

      - name: Open the session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          # Detached lets the workflow validate and publish one SSH command before the hold.
          detached: true

      - name: Publish the connection string
        shell: bash
        run: |
          ssh_line=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          if [[ -z "$ssh_line" || "$ssh_line" != ssh\ * || "$ssh_line" == *$'\n'* || "$ssh_line" == *$'\r'* ]]; then
            echo "::error title=No valid connection string::could not read one SSH command from the tmate socket"
            exit 1
          fi
          printf '%s\n' "$ssh_line" > tmate-ssh.txt
          echo "::notice title=Connect with this::${ssh_line}"
          echo "### Connect" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${ssh_line}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Make the connection retrievable while the runner is open
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmate-ssh-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmate-ssh.txt
          if-no-files-found: error
          retention-days: 1

      - name: Hold the runner open
        shell: pwsh
        run: |
          $minutes = [int]'${{ github.event.inputs.minutes }}'
          Write-Host "Session open for $minutes minutes. Connect with the SSH command above."
          Write-Host "It ends early if you delete the file below from inside the session:"
          Write-Host "  $env:RUNNER_TEMP\keep-open"
          New-Item -ItemType File -Path "$env:RUNNER_TEMP\keep-open" -Force | Out-Null
          $deadline = (Get-Date).AddMinutes($minutes)
          while ((Get-Date) -lt $deadline -and (Test-Path "$env:RUNNER_TEMP\keep-open")) {
            Start-Sleep -Seconds 15
          }
          Write-Host "Session closing."

      - name: Leave nothing behind
        if: always()
        shell: pwsh
        run: |
          # Belt and braces. The runner is discarded anyway, but an aborted job should not
          # leave the real package sitting in a temp directory on a machine still running.
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\pkg" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\coach" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:RUNNER_TEMP\package_key" -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:GITHUB_WORKSPACE\tmate-ssh.txt" -ErrorAction SilentlyContinue
          Write-Host "temp copies removed"
