# Why do the coach tools not attach on Windows?
#
# MEASURED 2026-08-22 in a live interactive session on this runner image: Coach launches,
# Claude Code starts, and the coach tools are absent — it reports having only web search and
# fetch. The same flags attach all eleven tools on macOS.
#
# The smoke test cannot see this. It spawns server.mjs DIRECTLY and drives the protocol
# itself, which proves the server works and says nothing about whether the CLIENT attached it.
# That gap is where this bug lives.
#
# `claude mcp list` health-checks each configured server and needs no login, so the attach
# step is reproducible on a runner with no credentials. Control, measured on macOS:
#   bill-coach: node /…/server.mjs - ✔ Connected

name: windows-mcp-diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Claude Code and Coach
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          Expand-Archive -Path test-package.zip -DestinationPath "$env:RUNNER_TEMP\coach" -Force
          Push-Location "$env:RUNNER_TEMP\coach\package"
          $out = (& node install\install.mjs 2>$null | Out-String).Trim()
          Pop-Location
          Write-Host "installer: $out"

      - name: The server, driven by hand (does it work at all on Windows)
        shell: pwsh
        run: |
          $d = "$env:USERPROFILE\.claude-bill-career-coach"
          $env:BILL_COACH_DATA_DIR = "$d\plugins\data\bill-career-coach-skills-dir"
          $req = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"diag","version":"1"}}}'
          $out = $req | node "$env:BILL_COACH_DATA_DIR\runtime\server.mjs" 2>&1 | Select-Object -First 1
          Write-Host "HANDSHAKE: $out"

      - name: Does Claude Code attach it — the shipped config, verbatim
        shell: pwsh
        continue-on-error: true
        run: |
          $d = "$env:USERPROFILE\.claude-bill-career-coach"
          $cfg = Get-Content "$d\mcp\coach-mcp.json" -Raw | ConvertFrom-Json
          $entry = $cfg.mcpServers.'bill-coach' | ConvertTo-Json -Depth 6 -Compress
          Write-Host "ENTRY: $entry"
          $probe = "$env:RUNNER_TEMP\probe-shipped"
          $env:CLAUDE_CONFIG_DIR = $probe
          & claude mcp add-json bill-coach $entry --scope user 2>&1 | Select-Object -Last 1
          Write-Host "--- health check, shipped config ---"
          & claude mcp list 2>&1 | Select-Object -Last 6

      - name: Same, but with the absolute path to node.exe
        shell: pwsh
        continue-on-error: true
        run: |
          # Hypothesis: a bare `node` command is spawned without a shell on Windows, so PATHEXT
          # never applies and the process cannot start. The docs say executables on PATH work
          # as-is, so if this one connects and the shipped one does not, the docs are wrong for
          # native Windows and the installer must render an absolute interpreter path.
          $d = "$env:USERPROFILE\.claude-bill-career-coach"
          $cfg = Get-Content "$d\mcp\coach-mcp.json" -Raw | ConvertFrom-Json
          $entry = @{
            type = 'stdio'
            command = (Get-Command node).Source
            args = @($cfg.mcpServers.'bill-coach'.args[0])
            env = @{ BILL_COACH_DATA_DIR = $cfg.mcpServers.'bill-coach'.env.BILL_COACH_DATA_DIR }
          } | ConvertTo-Json -Depth 6 -Compress
          Write-Host "ENTRY: $entry"
          $probe = "$env:RUNNER_TEMP\probe-abs"
          $env:CLAUDE_CONFIG_DIR = $probe
          & claude mcp add-json bill-coach $entry --scope user 2>&1 | Select-Object -Last 1
          Write-Host "--- health check, absolute node.exe ---"
          & claude mcp list 2>&1 | Select-Object -Last 6

      - name: Same, but wrapped in cmd /c
        shell: pwsh
        continue-on-error: true
        run: |
          $d = "$env:USERPROFILE\.claude-bill-career-coach"
          $cfg = Get-Content "$d\mcp\coach-mcp.json" -Raw | ConvertFrom-Json
          $entry = @{
            type = 'stdio'
            command = 'cmd'
            args = @('/c', 'node', $cfg.mcpServers.'bill-coach'.args[0])
            env = @{ BILL_COACH_DATA_DIR = $cfg.mcpServers.'bill-coach'.env.BILL_COACH_DATA_DIR }
          } | ConvertTo-Json -Depth 6 -Compress
          Write-Host "ENTRY: $entry"
          $probe = "$env:RUNNER_TEMP\probe-cmd"
          $env:CLAUDE_CONFIG_DIR = $probe
          & claude mcp add-json bill-coach $entry --scope user 2>&1 | Select-Object -Last 1
          Write-Host "--- health check, cmd /c wrapper ---"
          & claude mcp list 2>&1 | Select-Object -Last 6

      - name: The launcher's actual flag path, with MCP debug logging
        shell: pwsh
        continue-on-error: true
        run: |
          # All three config VARIANTS connect when the server is user-scoped. The launcher does
          # not use user scope: it passes --mcp-config as a FLAG. This runs that exact flag path
          # and keeps the debug log, which records MCP startup. Authentication will fail, but the
          # question is whether the server was attached BEFORE that point.
          $d = "$env:USERPROFILE\.claude-bill-career-coach"
          $env:CLAUDE_CONFIG_DIR = $d
          Write-Host "--- claude --debug=mcp with the launcher's flags ---"
          & claude --debug=mcp --setting-sources user --strict-mcp-config --mcp-config "$d\mcp\coach-mcp.json" --tools WebSearch,WebFetch -p "reply OK" 2>&1 | Select-Object -First 40
          Write-Host "--- exit code: $LASTEXITCODE ---"
          Write-Host "--- debug logs written under the sealed profile ---"
          if (Test-Path "$d\debug") {
            Get-ChildItem "$d\debug" -Filter *.txt | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName | Select-String -Pattern "mcp|server|spawn|ENOENT|strict|config" -CaseSensitive:$false | Select-Object -First 40
            }
          } else { Write-Host "(no debug directory)" }

      - name: If anything failed, read the server stderr the docs point at
        if: always()
        shell: pwsh
        run: |
          foreach ($p in @('probe-shipped','probe-abs','probe-cmd')) {
            $dbg = "$env:RUNNER_TEMP\$p\debug"
            if (Test-Path $dbg) {
              Write-Host "--- $p debug logs ---"
              Get-ChildItem $dbg -Filter *.txt | ForEach-Object {
                Get-Content $_.FullName -Tail 25
              }
            }
          }
