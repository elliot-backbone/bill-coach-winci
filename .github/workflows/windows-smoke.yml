# Real-Windows execution test for the Coach installer and runtime.
#
# This is the gate that macOS cannot provide: cmd.exe actually running the shim,
# PATHEXT resolution finding claude.cmd, the USER PATH written to the registry and
# read back by a fresh process, junctions created without elevation, and SQLite
# file locking on Windows across a server restart.
#
# The package in this repo is SCRUBBED (build/make-test-package.mjs in the private
# build tree): every byte of code is the real code, but the library, the state
# template and all coach content are emptied. No personal briefing, no memory
# atoms, no licensed dataset. Never commit the real package here.

name: windows-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zip:
        description: 'Path to the package zip in the repo'
        required: true
        default: 'test-package.zip'

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 24.0.0 is the floor the installer enforces (node:sqlite with FTS5).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Show environment
        shell: pwsh
        run: |
          node --version
          $PSVersionTable.PSVersion
          [Environment]::OSVersion.VersionString
          "PATHEXT = $env:PATHEXT"

      # Gives the runner a real claude.cmd, which is what exercises the installer's
      # PATHEXT resolution and the launcher's shell:true spawn.
      - name: Install Claude Code
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      # THE SCRUB CHECK RUNS FIRST, because it is the control that keeps Bill's data out of a
      # PUBLIC repository, and an audit on 2026-08-23 found it had ZERO call sites anywhere
      # while the handover claimed it "proves the scrub". A control nothing calls is not a
      # control. It runs before the smoke test so a package carrying real data fails the job
      # at once rather than after five minutes of installing it.
      - name: The package in this repo is genuinely scrubbed
        shell: pwsh
        run: |
          $zip = '${{ github.event.inputs.zip }}'
          if (-not $zip) { $zip = 'test-package.zip' }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\scrubcheck" -Force
          node build\scrub-check.mjs "$env:RUNNER_TEMP\scrubcheck\package"
          if ($LASTEXITCODE -ne 0) { throw "THE PACKAGE IN THIS PUBLIC REPO CARRIES REAL DATA" }

      - name: The scrubbed package manifest matches every byte
        shell: pwsh
        run: |
          node build\manifest-integrity-test.mjs "$env:RUNNER_TEMP\scrubcheck\package"
          if ($LASTEXITCODE -ne 0) { throw "the package manifest is stale or incomplete" }

      - name: Windows smoke test
        shell: pwsh
        run: |
          $zip = '${{ github.event.inputs.zip }}'
          if (-not $zip) { $zip = 'test-package.zip' }
          ./build/windows-smoke-test.ps1 -ZipPath $zip

      # THE CHECK THIS SUITE DID NOT HAVE, and the reason a broken build passed 53 tests.
      #
      # Everything above proves the SERVER works: the smoke test spawns server.mjs itself and
      # drives the protocol by hand. It says nothing about whether Claude Code ATTACHED it.
      # On 2026-08-22 a live Windows session opened with all eleven tools missing while this
      # suite was fully green, because the plugin-declared server does not attach on Windows.
      #
      # `claude mcp list` health-checks the configured servers and needs no sign-in, so the
      # client's own view of the registration is testable on a runner with no credentials.
      - name: Claude Code attaches the coach server
        shell: pwsh
        run: |
          # Self-contained: the smoke script purges the profile as its last act, so this
          # installs its own copy rather than reading whatever a previous step left behind.
          $zip = '${{ github.event.inputs.zip }}'
          if (-not $zip) { $zip = 'test-package.zip' }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\attach" -Force
          Push-Location "$env:RUNNER_TEMP\attach\package"
          $said = (& node install\install.mjs 2>$null | Out-String).Trim()
          Pop-Location
          Write-Host "installer said: $said"

          $profileDir = "$env:USERPROFILE\.claude-bill-career-coach"
          if (-not (Test-Path "$profileDir\.claude.json")) {
            throw "no user-scope registration at $profileDir\.claude.json — the installer did not write it"
          }
          $env:CLAUDE_CONFIG_DIR = $profileDir
          $out = (& claude mcp list 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch 'bill-coach') { throw "the client does not see the coach server at all" }
          if ($out -notmatch 'bill-coach.*(Connected|\u2714)') { throw "the coach server is registered but did not connect" }
          Write-Host "attached and connected"

      # The gates, run on Windows against a real install. Copying these files into the repo
      # without calling them would be a control nothing calls, which is the exact defect they
      # were written to catch. The attach step above leaves an install in place; these use it.
      # The migration test SKIPS unless given an old package, and an audit on 2026-08-23 found
      # it skipping on every run while its green line implied coverage: "(no pre-1.3 package to
      # migrate from; skipping)" increments no check. Stated as an absence rather than left to
      # read as a pass. Landing a fixture here is open work, not a claim.
      - name: Stated absence — migration coverage
        shell: pwsh
        run: |
          Write-Host "NOT COVERED ON WINDOWS: the 1.2.4 -> current migration path."
          Write-Host "migration-test.mjs needs an old package fixture that this repo does not carry."
          Write-Host "It IS covered on macOS in the build tree, where the fixture exists."

      - name: The runtime gates
        shell: pwsh
        run: |
          $home_ = $env:USERPROFILE
          $data = "$home_\.claude-bill-career-coach\plugins\data\bill-career-coach-skills-dir"
          $pkg = "$env:RUNNER_TEMP\attach\package"
          # Mark onboarding complete first, as the local runs do. Without it the onboarding pane
          # guard fires on every turn and these suites measure THAT rather than the gate each one
          # is written to test: four assertions inverted on Windows for exactly this reason,
          # blocks landing where the test expected a pass and vice versa.
          node build\complete-onboarding.mjs $data $pkg
          if ($LASTEXITCODE -ne 0) { throw "could not complete onboarding on the test profile" }
          node build\deliverable-store-test.mjs $home_ $pkg
          if ($LASTEXITCODE -ne 0) { throw "deliverable store failed on Windows" }
          node build\persistence-guard-test.mjs $pkg $data
          if ($LASTEXITCODE -ne 0) { throw "persistence guard failed on Windows" }
          node build\narrative-gate-test.mjs $pkg $home_
          if ($LASTEXITCODE -ne 0) { throw "narrative gate failed on Windows" }
          node build\cv-module-test.mjs $pkg $home_
          if ($LASTEXITCODE -ne 0) { throw "cv module failed on Windows" }
          node build\debrief-module-test.mjs $pkg $home_
          if ($LASTEXITCODE -ne 0) { throw "debrief module failed on Windows" }
          node build\company-family-test.mjs $pkg $home_
          if ($LASTEXITCODE -ne 0) { throw "company family failed on Windows" }
          node build\downstream-modules-test.mjs $pkg $home_
          if ($LASTEXITCODE -ne 0) { throw "downstream modules failed on Windows" }
          node build\engines-test.mjs $pkg
          if ($LASTEXITCODE -ne 0) { throw "module engines failed on Windows" }
          node build\streamed-register-test.mjs $home_ $pkg
          if ($LASTEXITCODE -ne 0) { throw "streamed-register guard failed on Windows" }
          node build\parrot-detector-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "parrot detector failed on Windows" }
          Write-Host "all ten gates hold on Windows"
